# =====================================================================
#  PUBLICATIONS
#  One entry per publication. Grouped by `year` on the pubs page, newest
#  first. Non-numeric years ("submitted", "in prep") are listed above all
#  numbered years, in reverse alphabetical order (so "submitted" comes
#  before "in prep").
#
#  Fields (only `title` and `year` are required):
#    title     publication title
#    authors   author list as you want it shown; your name (author.pub_name
#              in _config.yml) is emphasised automatically
#    venue     journal / proceedings, volume, page; shown in mono
#    status    optional small tag, e.g. "submitted", "in review"
#    note      optional one-line remark (Markdown allowed)
#    links     any of: ads, arxiv, doi, pdf, code, data, or any other key;
#              each becomes a [key] link. Values are full URLs, except
#              `doi` (bare DOI) and `arxiv` (bare arXiv id, in quotes so
#              YAML keeps it as text: "2601.01234"), which are expanded
#              automatically.
#    bibtex    optional; adds a [bib] toggle with a copy button
# =====================================================================

- title: Morphology of Eight Massive z ≈ 1 Galaxies with JWST MIRI/MRS
  authors: Marcus N. King, Andreas F., et al.
  year: in prep

- title: Onboard Multispectral Classification and Adaptive Downlink for Rapid Crop-Stress Diagnosis from Small Satellites
