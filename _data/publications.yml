- title: COSMOSPAH: Sequencing Molecular Dust — The Relation between Polycyclic Aromatic Hydrocarbons and the 2175 Angstrom UV Bump at z ≈ 1 and Implications for Higher Redshifts.
  authors: Faisst, A., Wang, W., Finner, K.; et al. (incl. MNK)
  year: in prep

