<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- if page.url == "/" or page.title == nil -%}
  {%- assign doc_title = site.title -%}
{%- else -%}
  {%- assign doc_title = page.title | append: " · " | append: site.title -%}
{%- endif %}
<title>{{ doc_title }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
<meta name="author" content="{{ site.author.name | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ doc_title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_html | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="theme-color" content="#fffdfb">
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preload" href="{{ '/assets/fonts/cormorant-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/jetbrains-mono-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<script>document.documentElement.className = document.documentElement.className.replace("no-js", "js");</script>
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
